services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    # ports:
    #  - 8090:8090
    volumes:
      - /home/calebh/app-data/beszel/data:/beszel_data
      - /home/calebh/app-data/beszel/socket:/beszel_socket
    networks:
      traefik:  
    labels:
      traefik.enable: true
      # HTTP
      traefik.http.routers.beszel.entrypoints: http
      traefik.http.routers.beszel.rule: Host(`beszel.apps.husovich.com`)
      traefik.http.routers.beszel.middlewares: traefik-https-redirect
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      # HTTPS
      traefik.http.routers.beszel-secure.entrypoints: https
      traefik.http.routers.beszel-secure.rule: Host(`beszel.apps.husovich.com`)
      traefik.http.routers.beszel-secure.tls.certresolver: myresolver

  beszel-agent:
    image: "henrygd/beszel-agent"
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJT2dT4VTHY2MHY/CZuTNmZOGYAF0LMIvzUJvs8xQCp8"

networks:
  traefik:
    external: true