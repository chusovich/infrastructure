services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.2.1 # 
    container_name: mealie
    restart: always
    #ports:
    #    - 9925:9000
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - /home/calebh/app-data/mealie/app:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: America/Anchorage
      BASE_URL: https://mealie.apps.husovich.com
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # Email Settings
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_FROM_NAME: Mealie
      SMTP_AUTH_STRATEGY: TLS
      SMTP_FROM_EMAIL: husovichbot@gmail.com
      SMTP_USER: husovichbot@gmail.com
      SMTP_PASSWORD: tkdy gaad aakc hurh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      traefik:
      mealie:
    labels:
      traefik.enable: true
      # HTTP
      traefik.http.routers.mealie.entrypoints: http
      traefik.http.routers.mealie.rule: Host(`mealie.apps.husovich.com`)
      traefik.http.routers.mealie.middlewares: traefik-https-redirect
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      # HTTPS
      traefik.http.routers.mealie-secure.entrypoints: https
      traefik.http.routers.mealie-secure.rule: Host(`mealie.apps.husovich.com`)
      traefik.http.routers.mealie-secure.tls.certresolver: myresolver

  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    volumes:
      - /home/calebh/app-data/mealie/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: mealie
      POSTGRES_USER: mealie
      PGUSER: mealie
    networks:
      mealie:
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3

# volumes:
#   mealie-data:
#   mealie-pgdata:

networks:
  mealie:
  traefik:
    external: true  