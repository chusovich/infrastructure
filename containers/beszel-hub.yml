services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    # ports:
    #  - 8090:8090
    volumes:
      - /home/calebh/app-data/beszel/data:/beszel_data
      - /home/calebh/app-data/beszel/socket:/beszel_socket
    networks:
      traefik:  
    labels:
      traefik.enable: 'true'
      # HTTP
      traefik.http.routers.beszel-web.entrypoints: http
      traefik.http.routers.beszel-web.rule: Host(`beszel.subdomain.husovich.com`)
      traefik.http.routers.beszel-web.middlewares: traefik-https-redirect
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      # HTTPS
      traefik.http.routers.beszel-websecure.entrypoints: https
      traefik.http.routers.beszel-websecure.rule: Host(`beszel.subdomain.husovich.com`)
      traefik.http.routers.beszel-websecure.tls.certresolver: myresolver