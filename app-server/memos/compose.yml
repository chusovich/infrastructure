services:
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    volumes:
      - ./.memos/:/var/opt/memos
    # ports:
    #   - 5230:5230
    networks:
      traefik:
    labels:
      traefik.enable: true
      # HTTP
      traefik.http.routers.memos.entrypoints: http
      traefik.http.routers.memos.rule: Host(`memos.apps.husovich.com`)
      traefik.http.routers.memos.middlewares: traefik-https-redirect
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      # HTTPS
      traefik.http.routers.memos-secure.entrypoints: https
      traefik.http.routers.memos-secure.rule: Host(`memos.apps.husovich.com`)
      traefik.http.routers.memos-secure.tls.certresolver: myresolver

networks:
  traefik:
    external: true  