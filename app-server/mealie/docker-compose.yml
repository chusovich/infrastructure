services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v1.12.0
    container_name: mealie
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1000M
    environment:
      ALLOW_SIGNUP: false
      PUID: 1000
      PGID: 1000
      TZ: America/NewYork
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://mealie.husovich.com
    volumes:
      - ./mealie-data:/app/data
    networks:
      traefik:  
    labels:
      traefik.enable: true
      # HTTP
      traefik.http.routers.mealie.entrypoints: http
      traefik.http.routers.mealie.rule: Host(`mealie.husovich.com`)
      traefik.http.routers.mealie.middlewares: traefik-https-redirect
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      # HTTPS
      traefik.http.routers.mealie-secure.entrypoints: https
      traefik.http.routers.mealie-secure.rule: Host(`mealie.husovich.com`)
      traefik.http.routers.mealie-secure.tls.certresolver: myresolver

networks:
  traefik:
    external: true  
