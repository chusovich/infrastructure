# Basic Config
substitutions:
  device_name: S31-001

esphome:
  name: s31-001
  friendly_name: S31-001

esp8266:
  board: esp12e
  early_pin_init: false

# Device Specific Config

logger:
  baud_rate: 0 # (UART logging interferes with cse7766)
  logs:
    sensor: DEBUG # (Overide any global setting, to VERBOSE will spamming the cse7766 sensors)

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"

sensor:
  - platform: cse7766
    current:
      name: "Current"
      accuracy_decimals: 2
      filters:
        - throttle_average: 60s
    voltage:
      name: "Voltage"
      accuracy_decimals: 2
      filters:
        - throttle_average: 60s
    power:
      name: "Power"
      accuracy_decimals: 2
      id: my_power
      filters:
        - throttle_average: 60s
    energy:
      name: "Energy"
      accuracy_decimals: 2
      filters:
        - throttle: 60s
    apparent_power: #(only available with version 2024.3.0 or greater)
      name: "Apparent Power"
      filters:
        - throttle_average: 60s
    power_factor: #(only available with version 2024.3.0 or greater)
      name: "Power Factor"
      accuracy_decimals: 2
      filters:
        - throttle_average: 60s

  - platform: total_daily_energy #(Optional, not specific to cse7766)
    name: "Daily Energy"
    power_id: my_power
    accuracy_decimals: 2

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO12
    id: relay
    restore_mode: ALWAYS_OFF # Powering the relay may cause damage or instability when the programmer is supplying Vcc.
    on_turn_on:
    - mqtt.publish:
        topic: ${device_name}/sensor/relay/state
        payload: "ON"
    on_turn_off:
    - mqtt.publish:
        topic: ${device_name}/sensor/relay/state
        payload: "OFF"

time:
  - platform: sntp #(required for total_daily_energy)
    id: my_time

status_led:
  pin:
    number: GPIO13
    inverted: True

# Import packages
packages:
  remote_package_files:
      url: https://github.com/chusovich/esphome-reuse
      files:
        # - path: sonoff-s31.yaml
        - path: device-base.yaml
          vars:
            wifi_ssid: !secret wifi_ssid
            wifi_password: !secret wifi_password
            mqtt_username: !secret mqtt_username
            mqtt_password: !secret mqtt_password
            ota_password: !secret ota_password
            ap_password: !secret ap_password
            web_server_password: !secret web_server_password
            web_server_username: !secret web_server_username
      ref: main  # optional
      refresh: 1min  # optional

# we don't want these on an esp8266
captive_portal: !remove
web_server: !remove