substitutions:
  device_name: feathers3
  sensor_update_interval: 20s

esphome:
  name: feathers3
  friendly_name: FeatherS3

esp32:
  board: adafruit_feather_esp32s3
  framework:
    type: esp-idf

# number:
#   - platform: template
#     id: variable
#     name: "Variable"
#     min_value: 0
#     max_value: 100 
#     step: 1
#     set_action: 
#       then:
#         - text.set:
#             id: variable_text
#             value: "Hello World"

i2c:
  sda: GPIO3
  scl: GPIO4

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
  version: 3

font:
    # gfonts://family[@weight]
  - file: "gfonts://Share Tech Mono"
    id: my_font
    size: 40

# Example configuration entry
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO6

time:
  - platform: sntp
    id: my_time

display:
  - platform: ssd1306_spi
    id: oled_display
    model: "SSD1306 128x64"
    cs_pin: GPIO12
    dc_pin: GPIO11
    reset_pin: GPIO10
    pages:
      - id: page1
        lambda: |-
          it.strftime(10, 5, id(my_font), "%H:%M", id(my_time).now());
      - id: page2
        lambda: |-
          it.printf(10, 5, id(my_font), "%0.1f°", id(sht4x_temp).state);
      # - id: page3
      #   lambda: |-
      #     it.print(10, 5, id(my_font), id(variable_text).state);

binary_sensor:
  - platform: gpio 
    id: button   
    pin: GPIO14
    on_press:
      - display.page.show_next: oled_display
      - component.update: oled_display

status_led:
  pin:
    number: GPIO13

packages:
  remote_package_files:
      url: https://github.com/chusovich/esphome-reuse
      files:
        - path: sensors/sht4x.yaml
        # - path: sensors/veml7700.yaml
        - path: device-base.yaml
          vars:
            wifi_ssid: !secret wifi_ssid
            wifi_password: !secret wifi_password
            mqtt_username: !secret mqtt_username
            mqtt_password: !secret mqtt_password
            ota_password: !secret ota_password
            ap_password: !secret ap_password
            web_server_password: !secret web_server_password
            web_server_username: !secret web_server_username
      ref: main  # optional
      refresh: 1min  # optional

logger: